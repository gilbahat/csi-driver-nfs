---
# A StorageClass for volumes that AIX pods mount. The AIX NFS client speaks
# NFSv3 and NFSv4.0 only, so nfsvers=4.1 (the upstream example) fails on AIX
# nodes unless their plugin runs with --aix-nfs4-minor-fallback.
#
# The server name is resolved by the AIX host, not by cluster DNS: use an IP
# address or a name in the node's /etc/hosts or DNS.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-csi-aix
provisioner: nfs.csi.k8s.io
parameters:
  server: 192.0.2.10
  share: /export
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4
  - hard
